{% extends 'menu.html' %}

{% block css %}

{% endblock %}
{% block title %}Productos{% endblock %}

{% block content %}
<h5 class="title is-5">Productos</h5>
<div class="container">
    <div class="field is-grouped">
        <p class="control">
            <a id="btnNuevo" class="has-icon button is-normal is-primary">
                <span class="icon"><i class="mdi mdi-plus"></i></span>
                <span>Nuevo Producto</span>
            </a>
        </p>
        <p class="control has-icons-left">
            <input type="text" name="searchInput" id="searchInput" class="input is-normal" placeholder="Filtrar">
            <span class="icon is-left"><i class="mdi mdi-table-search"></i></span>
        </p>
    </div>
    <h6 class="title is-6">Listado de Productos</h6>
    <table class="table is-striped" style="width: 100%;">
        <thead>
            <tr>
                <th scope="col">Codigo</th>
                <th scope="col">Descripción</th>
                <th scope="col">Acciones</th>
            </tr>
        </thead>
        <tbody id="productosTbody">

        </tbody>
    </table>
    <nav class="pagination is-small is-centered" role="navigation" aria-label="pagination">
        <ul class="pagination-list" id="paginationList">

        </ul>
    </nav>
</div>

<div id="modalProductos" class="modal is-hidden">
    <div class="modal-background"></div>
    <form id="formProductos" action="#" method="post">
        <div class="modal-card">
            <header class="modal-card-head">
                <p class="modal-card-title">Datos de Producto</p>
            </header>
            <section class="modal-card-body">
                <input type="text" name="idProducto" id="idProducto" class="input is-small is-hidden" hidden>
                <div class="field is-horizontal">
                    <div class="field-label" style="font-size: x-small;">
                        <label for="codProducto" class="label is-small">Codigo: <strong style="color: red;">*</strong></label>
                    </div>
                    <div class="field-body">
                        <div class="field">
                            <input type="text" name="codProducto" id="codProducto" class="input is-small" required>
                        </div>
                    </div>
                </div>
                <div class="field is-horizontal">
                    <div class="field-label" style="font-size: x-small;">
                        <label for="codBarraProducto" class="label is-small">Cod. Barras:</label>
                    </div>
                    <div class="field-body">
                        <div class="field">
                            <input type="text" name="codBarraProducto" id="codBarraProducto" class="input is-small">
                        </div>
                    </div>
                </div>
                <div class="field is-horizontal">
                    <div class="field-label" style="font-size: x-small;">
                        <label for="nomProducto" class="label is-small">Nombre: <strong style="color: red;">*</strong></label>
                    </div>
                    <div class="field-body">
                        <div class="field">
                            <input type="text" name="nomProducto" id="nomProducto" class="input is-small" required>
                        </div>
                    </div>
                </div>
                <div class="field is-horizontal">
                    <div class="field-label" style="font-size: x-small;">
                        <label for="descripcionProducto" class="label is-small">Descripción: <strong style="color: red;">*</strong></label>
                    </div>
                    <div class="field-body">
                        <div class="field">
                            <textarea name="descripcionProducto" id="descripcionProducto" class="textarea is-small" required></textarea>
                        </div>
                    </div>
                </div>
                <div class="field is-horizontal">
                    <div class="field-label" style="font-size: x-small;">
                        <label for="precioCompra" class="label is-small">Precio Compra: <strong style="color: red;">*</strong></label>
                    </div>
                    <div class="field-body">
                        <div class="field">
                            <input type="number" name="precioCompra" id="precioCompra" class="input is-small" required>
                        </div>
                    </div>
                </div>
                <div class="field is-horizontal">
                    <div class="field-label" style="font-size: x-small;">
                        <label for="precioVenta" class="label is-small">Precio Venta: <strong style="color: red;">*</strong></label>
                    </div>
                    <div class="field-body">
                        <div class="field">
                            <input type="number" name="precioVenta" id="precioVenta" class="input is-small" required>
                        </div>
                    </div>
                </div>
                <div class="field is-horizontal">
                    <div class="field-label" style="font-size: x-small;">
                        <label for="stockMinimo" class="label is-small">Stock Minimo: <strong style="color: red;">*</strong></label>
                    </div>
                    <div class="field-body">
                        <div class="field">
                            <input type="number" name="stockMinimo" id="stockMinimo" class="input is-small" min="1" required>
                        </div>
                    </div>
                </div>
                <div class="field is-horizontal">
                    <div class="field-label" style="font-size: x-small;">
                        <label for="stockMaximo" class="label is-small">Stock Maximo: <strong style="color: red;">*</strong></label>
                    </div>
                    <div class="field-body">
                        <div class="field">
                            <input type="number" name="stockMaximo" id="stockMaximo" class="input is-small" max="500" required>
                        </div>
                    </div>
                </div>
                <div class="field is-horizontal">
                    <div class="field-label" style="font-size: x-small;">
                        <label for="categoriaId" class="label is-small">Categoria: <strong style="color: red;">*</strong></label>
                    </div>
                    <div class="field-body">
                        <div class="field">
                            <span class="select is-small">
                                <select name="categoriaId" id="categoriaId" required>
                                    <option value=""></option>
                                    {% for categoria in categorias %}
                                    <option value="{{ categoria.idCategoria }}">{{ categoria.nomCategoria }}</option>
                                    {% endfor %}
                                </select>
                            </span>
                        </div>
                    </div>
                </div>
            </section>
            <footer class="modal-card-foot">
                <div class="buttons">
                    <button id="btnGuardar" type="submit" class="button is-normal is-success">
                        <span class="icon"><i class="mdi mdi-floppy"></i></span>
                        <span>Guardar</span>
                    </button>
                    <button id="btnActualizar" type="button" class="button is-normal is-success is-hidden">
                        <span class="icon"><i class="mdi mdi-pencil"></i></span>
                        <span>Guardar</span>
                    </button>
                    <a id="btnCancelar" class="button is-normal is-danger">
                        <span class="icon"><i class="mdi mdi-cancel"></i></span>
                        <span>Cancelar</span>
                    </a>
                </div>
            </footer>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/productos/productos.js') }}"></script>
{% endblock %}
